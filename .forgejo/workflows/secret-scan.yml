# Shizuha Origin CI — PLAT-4708: dedicated tracked-files private-key/secret scan,
# ported from the retired GitHub `.github/workflows/secret-scan.yml`. NOT covered
# by security-ci (semgrep/osv/trivy). Pure git-grep, no external tooling, no egress.
name: secret-scan
on:
  pull_request: {}
  push:
    branches: [master]

jobs:
  secret-scan:
    name: Tracked-files private-key/secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        run: |
          set -euo pipefail
          echo "Scanning for private keys and secrets in tracked files..."
          FOUND=0
          # PLAT-32: the detection patterns live in this file as literal strings —
          # exclude it from every grep so the scanner does not match itself.
          SELF_EXCL=':!.forgejo/workflows/secret-scan.yml'

          if git grep -l "BEGIN PRIVATE KEY" -- ':!node_modules' ':!*.md' ':!scripts/rotate-agent-keypair.sh' "$SELF_EXCL" 2>/dev/null; then
            echo "::error::PEM-encoded private key found in tracked files"; FOUND=1
          fi
          if git grep -l "BEGIN RSA PRIVATE KEY" -- ':!node_modules' ':!*.md' "$SELF_EXCL" 2>/dev/null; then
            echo "::error::RSA private key found in tracked files"; FOUND=1
          fi
          if git grep -l "BEGIN EC PRIVATE KEY" -- ':!node_modules' ':!*.md' "$SELF_EXCL" 2>/dev/null; then
            echo "::error::EC private key found in tracked files"; FOUND=1
          fi
          if git grep -l "BEGIN OPENSSH PRIVATE KEY" -- ':!node_modules' ':!*.md' "$SELF_EXCL" 2>/dev/null; then
            echo "::error::OpenSSH private key found in tracked files"; FOUND=1
          fi
          # Warning-only heuristic for inline api-key/secret assignments.
          if git grep -lP "(?i)(api[_-]?key|api[_-]?secret|access[_-]?token)\s*[:=]\s*['\"][a-zA-Z0-9]{20,}" -- ':!node_modules' ':!*.md' ':!tests/' ':!*.test.*' "$SELF_EXCL" 2>/dev/null; then
            echo "::warning::Possible API key/secret found — review manually"
          fi

          if [ "$FOUND" -ne 0 ]; then
            echo "Secret scan FAILED. Remove private keys from tracked files (or add fixtures to the exclusion list)."
            exit 1
          fi
          echo "Secret scan passed — no private keys found."
